name: Validate Sigma Rules

on:
  push:
    branches: [ main ]
    paths: 
      - 'rules/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install pyyaml
        pip install sigma-cli
        pip install pytest
    
    - name: Install Sigma Plugins
      run: |
        sigma plugin install splunk
        sigma plugin install kusto
        sigma plugin install elasticsearch
    
    - name: Validate Sigma rule syntax
      run: |
        echo "Validating YAML syntax for all rules..."
        find rules/ -type f -name "*.yml" -exec sigma check {} \;
    
    - name: Convert to Splunk SPL
      run: |
        mkdir -p output/splunk
        find rules/ -type f -name "*.yml" | while read rule; do
          filename=$(basename "$rule" .yml)
          sigma convert -t splunk "$rule" > "output/splunk/${filename}.spl" || echo "Splunk conversion skipped for $rule"
        done
    
    - name: Convert to Sentinel KQL
      run: |
        mkdir -p output/sentinel
        find rules/ -type f -name "*.yml" | while read rule; do
          filename=$(basename "$rule" .yml)
          sigma convert -t kusto "$rule" > "output/sentinel/${filename}.kql" || echo "Sentinel conversion skipped for $rule"
        done

    - name: Convert to Elastic ECS
      run: |
        mkdir -p output/elastic
        find rules/ -type f -name "*.yml" | while read rule; do
          filename=$(basename "$rule" .yml)
          sigma convert -t elasticsearch "$rule" > "output/elastic/${filename}.txt" || echo "Elastic conversion skipped for $rule"
        done
    
    - name: Run unit tests
      run: |
        python -m pytest tests/ -v || echo "Tests pending implementation"
    
    - name: Upload converted rules
      uses: actions/upload-artifact@v4
      with:
        name: converted-rules
        path: output/