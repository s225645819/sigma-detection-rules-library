title: Command Execution from Office Applications
id: a6789012-f345-a678-b901-c23456789012
status: experimental
description: Detects cmd.exe or powershell.exe spawned from Microsoft Office applications, a common macro execution technique.
author: Pratiyush
date: 2026-05-31
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith:
      - '\WINWORD.EXE'
      - '\EXCEL.EXE'
      - '\POWERPNT.EXE'
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
  condition: selection
falsepositives:
  - Highly specific legacy macros (requires investigation)
level: high
tags:
  - attack.execution
  - attack.t1203